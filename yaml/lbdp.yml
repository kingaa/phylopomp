name: LBDP
description: Linear birth-death-sampling model
details: |-
  The genealogy process induced by a simple linear birth-death process with constant-rate sampling.
demes: deme
parameter:
  lambda:
    name: lambda
    description: per capita birth rate
    type: double
    default: 2
  mu:
    name: mu
    description: per capita death rate
    type: double
    default: 1.0
  psi:
    name: psi
    description: per capita non-destructive sampling rate
    default: 1.0
    type: double
  chi:
    name: chi
    description: per capita destructive sampling rate
    default: 0.0
    type: double
ivp:
  n0:
    name: n0
    description: population size at time t0
    default: 5
    type: int
  max_sample:
    name: max_sample
    description: maximum number of samples
    default: 10000
    type: int
state:
  popsize:
    name: 'n'
    type: int
  nsample:
    name: nsample
    type: int
rinit: |-
    state.n = params.n0;
    state.nsample = 0;
    graft(deme,params.n0);
events:
  birth:
    rate: |-
      (state.nsample < params.max_sample) ? params.lambda * state.n : 0.0
    jump: state.n += 1; birth();
  death:
    rate: |-
      (state.nsample < params.max_sample) ? params.mu * state.n : 0.0
    jump: state.n -= 1; death();
  sample_death:
    rate: |-
      (state.nsample < params.max_sample) ? params.chi * state.n: 0.0
    jump: state.n -= 1; state.nsample++; sample_death();
  sample:
    rate: |-
      (state.nsample < params.max_sample) ? params.psi * state.n : 0.0
    jump: state.nsample++; sample();
